<svg xmlns="http://www.w3.org/2000/svg" width="158" height="42" viewBox="0 0 158 42" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio</title>
  <desc id="desc">Cyber HUD navigation control linking to Mukund V's portfolio.</desc>
  <defs>
    <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#00d9ff"/><stop offset=".55" stop-color="#b388ff"/><stop offset="1" stop-color="#6a1b9a"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2" result="b"/><feFlood flood-color="#00d9ff" flood-opacity=".4"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .scan{animation:scan 5.6s ease-in-out infinite}.pulse{animation:pulse 3.2s ease-in-out infinite}
    @keyframes scan{0%,100%{transform:translateX(-36px);opacity:0}20%,80%{opacity:.2}50%{transform:translateX(160px);opacity:.09}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.scan,.pulse{animation:none}}
  </style>
  <rect x="1" y="1" width="156" height="40" rx="8" fill="#11161d" stroke="#30363d"/>
  <path d="M1 12V8q0-7 7-7h18M132 41h18q7 0 7-7v-4" fill="none" stroke="url(#edge)"/>
  <path class="scan" d="M-30 2h18l12 38h-18z" fill="#00d9ff" opacity="0"/>
  <g fill="none" stroke="#00d9ff" stroke-width="1.15" filter="url(#glow)"><rect x="11" y="13" width="22" height="17" rx="2"/><path d="M11 18h22M15 16h1M18 16h1M21 16h1M16 22h5v4h-5zM24 22h5M24 25h5"/></g>
  <text x="43" y="26" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" letter-spacing="1.35">PORTFOLIO</text>
  <circle cx="144" cy="21" r="2.5" fill="#00d9ff" class="pulse" filter="url(#glow)"/>
</svg>
