<svg xmlns="http://www.w3.org/2000/svg" width="158" height="42" viewBox="0 0 158 42" role="img" aria-labelledby="title desc">
  <title id="title">Resume</title>
  <desc id="desc">Cyber HUD navigation control opening Mukund V's resume.</desc>
  <defs>
    <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#6a1b9a"/><stop offset="1" stop-color="#b388ff"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2" result="b"/><feFlood flood-color="#b388ff" flood-opacity=".45"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .scan{animation:scan 5s ease-in-out infinite}.pulse{animation:pulse 2.9s ease-in-out infinite}
    @keyframes scan{0%,100%{transform:translateX(-36px);opacity:0}20%,80%{opacity:.2}50%{transform:translateX(160px);opacity:.09}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.scan,.pulse{animation:none}}
  </style>
  <rect x="1" y="1" width="156" height="40" rx="8" fill="#11161d" stroke="#30363d"/>
  <path d="M1 12V8q0-7 7-7h18M132 41h18q7 0 7-7v-4" fill="none" stroke="url(#edge)"/>
  <path class="scan" d="M-30 2h18l12 38h-18z" fill="#b388ff" opacity="0"/>
  <g fill="none" stroke="#b388ff" stroke-width="1.15" filter="url(#glow)"><path d="M14 11h12l6 6v14H14zM26 11v6h6M18 22h10M18 26h8"/></g>
  <text x="43" y="26" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600" letter-spacing="1.7">RESUME</text>
  <circle cx="144" cy="21" r="2.5" fill="#b388ff" class="pulse" filter="url(#glow)"/>
</svg>
