<svg xmlns="http://www.w3.org/2000/svg" width="220" height="42" viewBox="0 0 220 42" role="img" aria-labelledby="title desc">
  <title id="title">Open all repositories</title><desc id="desc">Cyber HUD navigation control linking to all Haruto69 repositories.</desc>
  <defs><linearGradient id="edge" x1="0" x2="1"><stop stop-color="#00d9ff"/><stop offset=".55" stop-color="#b388ff"/><stop offset="1" stop-color="#6a1b9a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.p{animation:p 3s ease-in-out infinite}.s{animation:s 5.5s ease-in-out infinite}@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}@keyframes s{0%,100%{transform:translateX(-30px);opacity:0}50%{transform:translateX(225px);opacity:.12}}@media(prefers-reduced-motion:reduce){.p,.s{animation:none}}</style>
  <rect x="1" y="1" width="218" height="40" rx="8" fill="#11161d" stroke="#30363d"/><path d="M1 12V8q0-7 7-7h24M188 41h24q7 0 7-7v-4" fill="none" stroke="url(#edge)"/><path class="s" d="M-25 2h15L2 40h-15z" fill="#00d9ff" opacity="0"/><g fill="none" stroke="#00d9ff"><circle cx="18" cy="16" r="3"/><circle cx="28" cy="21" r="3"/><circle cx="18" cy="27" r="3"/><path d="M21 17l4 2M21 25l4-2"/></g><text x="44" y="26" class="m" fill="#c9d1d9" font-size="10.5" font-weight="700" letter-spacing="1.25">OPEN ALL REPOSITORIES</text><circle cx="205" cy="21" r="2.5" fill="#b388ff" class="p" filter="url(#glow)"/>
</svg>
