  <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.scan{animation:scan 7s ease-in-out infinite}.pulse{animation:pulse 3.2s ease-in-out infinite}.dot{animation:dot 6s linear infinite}@keyframes scan{0%,100%{transform:translateY(-8px);opacity:0}15%,85%{opacity:.3}50%{transform:translateY(176px);opacity:.1}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes dot{0%{transform:translateX(0);opacity:0}15%,85%{opacity:1}100%{transform:translateX(112px);opacity:0}}@media(prefers-reduced-motion:reduce){.scan,.pulse,.dot{animation:none}}</style>
