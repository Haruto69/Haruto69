<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="title desc">
  <title id="title">DishaRakshak</title>
  <desc id="desc">Flagship project card for a GPS-independent inertial navigation concept.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11161d"/><stop offset=".62" stop-color="#0d1117"/><stop offset="1" stop-color="#140f1c"/></linearGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#b388ff"/><stop offset=".55" stop-color="#00d9ff"/><stop offset="1" stop-color="#6a1b9a"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#30363d" stroke-width=".6" opacity=".35"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feFlood flood-color="#b388ff" flood-opacity=".5"/><feComposite in2="b" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect x="1" y="1" width="558" height="248" rx="12"/></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.scan{animation:scan 7.6s ease-in-out infinite}.pulse{animation:pulse 3.4s ease-in-out infinite}.ring{animation:spin 18s linear infinite;transform-origin:478px 188px}
    @keyframes scan{0%,100%{transform:translateY(-12px);opacity:0}15%,85%{opacity:.32}50%{transform:translateY(244px);opacity:.11}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.scan,.pulse,.ring{animation:none}}
  </style>
  <rect x="1" y="1" width="558" height="248" rx="12" fill="url(#panel)" stroke="#30363d"/>
  <g clip-path="url(#clip)"><rect x="1" y="1" width="558" height="248" fill="url(#grid)"/><g class="scan"><rect x="1" width="558" height="2" fill="url(#edge)" filter="url(#glow)"/><rect x="1" y="2" width="558" height="16" fill="#b388ff" opacity=".025"/></g></g>
  <path d="M1 42V13Q1 1 13 1h90M457 1h90q12 0 12 12v29M1 208v29q0 12 12 12h90M457 249h90q12 0 12-12v-29" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <g class="mono">
    <text x="22" y="27" fill="#8b949e" font-size="9" letter-spacing="1.8">FLAGSHIP SYSTEM // 02</text>
    <text x="538" y="27" text-anchor="end" fill="#b388ff" font-size="9" letter-spacing="1.5">STATUS // R&amp;D</text>
    <circle cx="466" cy="23" r="3" fill="#b388ff" class="pulse" filter="url(#glow)"/>
    <text x="22" y="58" fill="#00d9ff" font-size="10" letter-spacing="1.8">EMBEDDED / NAVIGATION / IOT</text>
    <text x="22" y="88" fill="#f0f6fc" font-size="22" font-weight="700" letter-spacing="2">DISHARAKSHAK</text>
    <rect x="22" y="99" width="516" height="1" fill="url(#edge)" opacity=".75"/>
    <text x="22" y="123" fill="#c9d1d9" font-size="11.5">GPS-independent navigation concept for GPS-denied environments</text>
    <text x="22" y="140" fill="#c9d1d9" font-size="11.5">using foot-mounted IMUs, ESP32 communication, dead reckoning,</text>
    <text x="22" y="157" fill="#c9d1d9" font-size="11.5">and zero-velocity updates.</text>
    <g fill="#0d1117" stroke="#30363d"><rect x="22" y="174" width="54" height="22" rx="4"/><rect x="82" y="174" width="42" height="22" rx="4"/><rect x="130" y="174" width="82" height="22" rx="4"/><rect x="218" y="174" width="42" height="22" rx="4"/><rect x="266" y="174" width="46" height="22" rx="4"/></g>
    <g fill="#b388ff" font-size="8.5" text-anchor="middle"><text x="49" y="188">ESP32</text><text x="103" y="188">IMU</text><text x="171" y="188">EMBEDDED C</text><text x="239" y="188">IOT</text><text x="289" y="188">ZUPT</text></g>
    <rect x="22" y="211" width="192" height="23" rx="4" fill="#00d9ff" opacity=".09" stroke="#00d9ff"/>
    <text x="36" y="225" fill="#00d9ff" font-size="9.5" letter-spacing="1.2">GPS-DENIED NAVIGATION</text>
    <text x="538" y="218" text-anchor="end" fill="#6e7681" font-size="8.5">VECTOR // NAVIGATION</text>
    <text x="538" y="232" text-anchor="end" fill="#6e7681" font-size="8.5">SIGNAL // INERTIAL</text>
  </g>
  <g fill="none" transform="translate(0 0)"><circle cx="478" cy="188" r="28" stroke="#30363d"/><circle cx="478" cy="188" r="17" stroke="#30363d" stroke-dasharray="3 5"/><path class="ring" d="M478 160a28 28 0 0 1 24 14" stroke="#b388ff" stroke-width="2"/><circle cx="478" cy="188" r="3" fill="#00d9ff" class="pulse"/></g>
</svg>
