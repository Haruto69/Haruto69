name: Generate 3D contribution profile

on:
  schedule:
    - cron: "17 21 * * *" # 02:47 Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate contribution skyline
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate 31-day activity signal
        run: node scripts/generate-activity-signal.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Commit updated profile visuals
        shell: bash
        run: |
          git add profile-3d-contrib assets/activity-signal.svg

          if git diff --cached --quiet; then
            echo "Generated profile visuals are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated profile visuals"
          git push
